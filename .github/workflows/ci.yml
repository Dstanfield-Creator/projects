name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    name: Relative link check
    steps:
      - uses: actions/checkout@v4
      - name: Check relative Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress --include-fragments './**/*.md'"
          fail: true
  shellcheck:
    runs-on: ubuntu-latest
    name: ShellCheck
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck -S error \
            tools/lab-power-scripts/lab-up \
            tools/lab-power-scripts/lab-down \
            tools/lab-ssh-check/lab-ssh-check \
            tools/firewall-deadman-switch/fw-deadman
